<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Alertas TikTok Live</title>
    <style>
        /* --- ESTILOS GENERALES Y CONFIGURACIÓN --- */
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --bg-input: #26262b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #fe2c55; /* Color TikTok pink */
            --accent-blue: #25f4ee; /* Color TikTok cyan */
            --green: #10b981;
            --yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 400px 1fr; /* Panel izquierdo fijo, Monitor derecho flexible */
            }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-card);
            padding-bottom: 10px;
            width: 100%;
            max-width: 1100px;
        }

        h1 span {
            color: var(--primary);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- TARJETAS / CONTENEDORES --- */
        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2e2e35;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        /* --- FORMULARIO DE CONEXIÓN --- */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid #3f3f46;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .btn-connect {
            background-color: var(--primary);
            color: white;
        }

        .btn-connect:hover {
            background-color: #e02447;
        }

        .btn-disconnect {
            background-color: #3f3f46;
            color: var(--text-main);
        }

        .btn-disconnect:hover {
            background-color: #52525b;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- PANEL DE CONFIGURACIÓN DE AUDIO --- */
        .sound-setting-group {
            margin-bottom: 18px;
        }

        .sound-setting-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        select {
            width: 100%;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid #3f3f46;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* --- MONITOR EN VIVO DE INTERACCIONES --- */
        .monitor-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 550px) {
            .monitor-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .monitor-column {
            background-color: var(--bg-input);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 590px; /* Ajustado para alinearse con los dos paneles de la izquierda */
        }

        .column-header {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
        }

        .col-followers .column-header { color: var(--accent-blue); }
        .col-likers .column-header { color: var(--green); }
        .col-gifters .column-header { color: var(--yellow); }

        .user-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
        }

        .user-list::-webkit-scrollbar { width: 4px; }
        .user-list::-webkit-scrollbar-thumb { background-color: #3f3f46; border-radius: 4px; }

        .user-list li {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 3px solid transparent;
        }

        .col-followers .user-list li { border-left-color: var(--accent-blue); }
        .col-likers .user-list li { border-left-color: var(--green); }
        .col-gifters .user-list li { border-left-color: var(--yellow); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-notice {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>StreamAlerts <span>LIVE</span></h1>

    <div class="container">
        
        <!-- COLUMNA IZQUIERDA -->
        <div>
            <!-- CONEXIÓN A TIKTOK -->
            <div class="card">
                <h2>🔗 Conectar Transmisión</h2>
                <div class="input-group">
                    <input type="text" id="username-input" placeholder="Ej: @username_tiktok">
                    <button class="btn-connect" id="connect-btn">Conectar</button>
                    <button class="btn-disconnect" id="disconnect-btn" style="display:none;">Salir</button>
                </div>
                <div class="status-text" id="status-label">Estado: Desconectado</div>
            </div>

            <!-- REPOSITORIO DE SONIDOS -->
            <div class="card">
                <h2>⚙️ Repositorio de Sonidos</h2>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">
                    Asigna un audio para cada interacción en TikTok.
                </p>
                
                <div class="sound-setting-group">
                    <label for="follow-sound-select">Nuevos Seguidores</label>
                    <select id="follow-sound-select">
                        <option value="">Cargando sonidos...</option>
                    </select>
                </div>

                <div class="sound-setting-group">
                    <label for="like-sound-select">Alerta de Likes</label>
                    <select id="like-sound-select">
                        <option value="">Cargando sonidos...</option>
                    </select>
                </div>

                <div class="sound-setting-group">
                    <label for="gift-sound-select">Alerta de Regalos</label>
                    <select id="gift-sound-select">
                        <option value="">Cargando sonidos...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: MONITOR -->
        <div class="card">
            <h2>📊 Monitor de Actividad</h2>
            <div class="monitor-grid">
                
                <!-- Seguidores -->
                <div class="monitor-column col-followers">
                    <div class="column-header">
                        <span>Seguidores</span>
                        <span id="count-followers">0</span>
                    </div>
                    <ul class="user-list" id="followers-container">
                        <p class="empty-notice">Esperando interacciones...</p>
                    </ul>
                </div>

                <!-- Likes -->
                <div class="monitor-column col-likers">
                    <div class="column-header">
                        <span>Likes</span>
                        <span id="count-likers">0</span>
                    </div>
