<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAlerts LIVE</title>
        <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1c23">
    <style>
        body { background-color: #0f1117; color: #f3f4f6; font-family: sans-serif; padding: 20px; }
        .card { background: #1a1c23; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2d3139; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; background: #2d3139; color: white; border: none; border-radius: 4px; }
        button { background: #fe2c55; font-weight: bold; cursor: pointer; }
        #disconnect-btn { background: #374151; display: none; }
        .monitor { display: flex; gap: 10px; }
        .panel { flex: 1; background: #1a1c23; padding: 10px; border-radius: 8px; }
        ul { padding-left: 15px; max-height: 150px; overflow-y: auto; }
        .empty-notice { color: #9ca3af; font-size: 0.9em; }
    </style>
</head>
<body>
    <h2>StreamAlerts <span style="color: #fe2c55;">LIVE</span></h2>

    <div class="card">
        <h3>🔗 Conectar Transmisión</h3>
        <input type="text" id="username-input" placeholder="@usuario_tiktok">
        <button id="connect-btn">Conectar</button>
        <button id="disconnect-btn">Desconectar</button>
        <p id="status-label" style="font-size: 0.85em; margin-top: 8px;">Estado: Desconectado</p>
    </div>

    <div class="card">
        <h3>⚙️ Repositorio de Sonidos</h3>
        <p style="font-size: 0.85em; color: #9ca3af;">Asigna un audio para cada interacción en TikTok.</p>
        <label>Nuevos Seguidores</label>
        <select id="follow-sound-select"><option value="">Ninguno (Silencio)</option></select>
        <label style="margin-top: 10px; display: block;">Alerta de Regalos</label>
        <select id="gift-sound-select"><option value="">Ninguno (Silencio)</option></select>
    </div>

    <div class="monitor">
        <div class="panel">
            <h4>📊 SEGUIDORES <span id="count-followers" style="float: right;">0</span></h4>
            <ul id="followers-container"><p class="empty-notice">Esperando seguidores...</p></ul>
        </div>
        <div class="panel">
            <h4>🎁 REGALOS <span id="count-gifters" style="float: right;">0</span></h4>
            <ul id="gifters-container"><p class="empty-notice">Esperando regalos...</p></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); 
        let alertSoundsConfig = { follow: '', gift: '' };

        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const usernameInput = document.getElementById('username-input');
        const statusLabel = document.getElementById('status-label');

        statusLabel.textContent = "Estado: Buscando servidor...";
        
        socket.on('connect', () => {
            statusLabel.textContent = "Estado: Servidor enlazado (Listo)";
            statusLabel.style.color = "#25f4ee"; 
        });

        socket.on('connect_error', (err) => {
            statusLabel.textContent = "Error de red: " + err.message;
            statusLabel.style.color = "#fe2c55"; 
        });

        connectBtn.addEventListener('click', () => {
            const user = usernameInput.value;
            if(user) {
                statusLabel.textContent = "Estado: Intentando conectar...";
                statusLabel.style.color = "#f3f4f6";
                socket.emit('start-live', user);
            }
        });

        disconnectBtn.addEventListener('click', () => {
            socket.emit('stop-live');
        });

        socket.on('connection-status', (data) => {
            statusLabel.textContent = `Estado: ${data.message}`;
            if(data.status === 'connected') {
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'block';
                usernameInput.disabled = true;
                statusLabel.style.color = "#25f4ee";
            } else {
                connectBtn.style.display = 'block';
                disconnectBtn.style.display = 'none';
                usernameInput.disabled = false;
                statusLabel.style.color = "#fe2c55";
            }
        });

        socket.on('available-sounds', (soundsList) => {
            const selectors = ['follow-sound-select', 'gift-sound-select'];
            selectors.forEach(id => {
                const selectEl = document.getElementById(id);
                if (!selectEl) return;
                
                selectEl.innerHTML = '<option value="">Ninguno (Silencio)</option>';
                if(soundsList && soundsList.length > 0) {
                    soundsList.forEach(soundFile => {
                        const option = document.createElement('option');
                        option.value = soundFile;
                        option.textContent = soundFile;
                        selectEl.appendChild(option);
                    });
                }
                selectEl.addEventListener('change', (e) => {
                    const type = id.split('-'); 
                    alertSoundsConfig[type[0]] = e.target.value;
                });
            });
        });

        socket.on('play-alert', (data) => {
            const chosenSoundFile = alertSoundsConfig[data.type];
            if (chosenSoundFile) {
                const audio = new Audio(`/Sounds/${chosenSoundFile}`);
                audio.play().catch(err => console.log("Bloqueo de audio:", err));
            }
        });

        socket.on('update-interactions', (activeUsers) => {
            const followersList = document.getElementById('followers-container');
            const giftersList = document.getElementById('gifters-container');
            if (followersList) {
                document.getElementById('count-followers').textContent = activeUsers.followers.length;
                followersList.innerHTML = activeUsers.followers.length > 0
                    ? activeUsers.followers.map(user => `<li>@${user}</li>`).join('')
                    : '<p class="empty-notice">Esperando seguidores...</p>';
            }

            if (giftersList) {
                document.getElementById('count-gifters').textContent = activeUsers.gifters.length;
                giftersList.innerHTML = activeUsers.gifters.length > 0
                    ? activeUsers.gifters.map(giftObj => `
                        <li>
                            <span>@${giftObj.username}</span>
                            <span class="gift-info">${giftObj.giftName} (${giftObj.diamonds}💎)</span>
                        </li>
                    `).join('')
                    : '<p class="empty-notice">Esperando regalos...</p>';
            }
        }); 
    <script>
        // Registrar el Service Worker para permitir la instalación en Android
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado', reg))
                    .catch(err => console.log('Error en Service Worker', err));
            });
        }
    </script>
</body>
</html>
