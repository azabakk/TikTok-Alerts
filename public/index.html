<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Alertas TikTok Live</title>
    <style>
        /* --- ESTILOS GENERALES Y CONFIGURACIÓN --- */
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --bg-input: #26262b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #fe2c55; /* Color TikTok pink */
            --accent-blue: #25f4ee; /* Color TikTok cyan */
            --green: #10b981;
            --yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 400px 1fr; /* Panel izquierdo fijo, Monitor derecho flexible */
            }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-card);
            padding-bottom: 10px;
            width: 100%;
            max-width: 1100px;
        }

        h1 span {
            color: var(--primary);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- TARJETAS / CONTENEDORES --- */
        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2e2e35;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* --- PANEL DE CONFIGURACIÓN DE AUDIO --- */
        .sound-setting-group {
            margin-bottom: 18px;
        }

        .sound-setting-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        select {
            width: 100%;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid #3f3f46;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* --- MONITOR EN VIVO DE INTERACCIONES --- */
        .monitor-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 550px) {
            .monitor-grid {
                grid-template-columns: repeat(3, 1fr); /* 3 Columnas: Seguidores, Likes, Regalos */
            }
        }

        .monitor-column {
            background-color: var(--bg-input);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 450px;
        }

        .column-header {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
        }

        /* Colores dinámicos para identificar las columnas */
        .col-followers .column-header { color: var(--accent-blue); }
        .col-likers .column-header { color: var(--green); }
        .col-gifters .column-header { color: var(--yellow); }

        .user-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
        }

        /* Personalización de la barra de scroll integrada */
        .user-list::-webkit-scrollbar {
            width: 4px;
        }
        .user-list::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 4px;
        }

        .user-list li {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 3px solid transparent;
        }

        /* Efecto de borde por tipo de lista */
        .col-followers .user-list li { border-left-color: var(--accent-blue); }
        .col-likers .user-list li { border-left-color: var(--green); }
        .col-gifters .user-list li { border-left-color: var(--yellow); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-notice {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>StreamAlerts <span>LIVE</span></h1>

    <div class="container">
        
        <!-- SECCIÓN 1: CONFIGURACIÓN DE AUDIO (PANEL IZQUIERDO) -->
        <div class="card">
            <h2>⚙️ Repositorio de Sonidos</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
                Asigna un archivo de audio de tu servidor para cada interacción recibida en TikTok.
            </p>
            
            <div class="sound-setting-group">
                <label for="follow-sound-select">Alerta de Nuevos Seguidores</label>
                <select id="follow-sound-select">
                    <option value="">Cargando sonidos...</option>
                </select>
            </div>

            <div class="sound-setting-group">
                <label for="like-sound-select">Alerta de Likes</label>
                <select id="like-sound-select">
                    <option value="">Cargando sonidos...</option>
                </select>
            </div>

            <div class="sound-setting-group">
                <label for="gift-sound-select">Alerta de Regalos</label>
                <select id="gift-sound-select">
                    <option value="">Cargando sonidos...</option>
                </select>
            </div>
        </div>

        <!-- SECCIÓN 2: MONITOR DE INTERACCIONES EN TIEMPO REAL (PANEL DERECHO) -->
        <div class="card">
            <h2>📊 Monitor de Actividad</h2>
            
            <div class="monitor-grid">
                
                <!-- Columna Seguidores -->
                <div class="monitor-column col-followers">
                    <div class="column-header">
                        <span>Seguidores</span>
                        <span id="count-followers">0</span>
                    </div>
                    <ul class="user-list" id="followers-container">
                        <p class="empty-notice" id="empty-follow">Esperando interacciones...</p>
                    </ul>
                </div>

                <!-- Columna Likes -->
                <div class="monitor-column col-likers">
                    <div class="column-header">
                        <span>Likes</span>
                        <span id="count-likers">0</span>
                    </div>
                    <ul class="user-list" id="likers-container">
                        <p class="empty-notice" id="empty-like">Esperando interacciones...</p>
                    </ul>
                </div>

                <!-- Columna Regalos -->
                <div class="monitor-column col-gifters">
                    <div class="column-header">
                        <span>Regalos</span>
                        <span id="count-gifters">0</span>
                    </div>
                    <ul class="user-list" id="gifters-container">
                        <p class="empty-notice" id="empty-gift">Esperando interacciones...</p>
                    </ul>
                </div>

            </div>
        </div>

    </div>

    <!-- Cargar Socket.io y tu lógica javascript de control cliente abajo -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Aquí puedes pegar el código JS del cliente que te compartí en el mensaje anterior
        // El script se acoplará perfectamente con los IDs de este HTML.
    </script>
</body>
</html>
