<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas TikTok Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería Socket.io para la comunicación en tiempo real -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased pb-12">

    <!-- Encabezado -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <span class="text-pink-500">⚡</span> TikTok Alerts
            </h1>
            <div id="status-badge" class="flex items-center gap-2 bg-red-950/50 border border-red-800/50 px-3 py-1 rounded-full text-xs text-red-400">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                Desconectado
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- 1. Tarjeta de Conexión -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">1. Conexión al Live</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Usuario de TikTok</label>
                    <div class="flex gap-2">
                        <span class="bg-gray-800 border border-gray-700 rounded-xl px-3 flex items-center text-gray-400">@</span>
                        <input type="text" id="tiktok-user" placeholder="tu_usuario" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 transition">
                    </div>
                </div>
                <button onclick="toggleConnection()" id="connect-btn" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-pink-600/20 text-sm flex justify-center items-center gap-2">
                    Conectar Transmisión
                </button>
            </div>
        </section>

        <!-- 2. Registro de Actividad en Vivo (Logs visuales) -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-3">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">3. Actividad Reciente</h2>
            <div id="event-log" class="bg-gray-950 border border-gray-800 rounded-xl p-3 h-40 overflow-y-auto text-xs space-y-2 text-gray-400">
                <p class="text-gray-600 italic">Esperando conexión al live...</p>
            </div>
        </section>

                        <!-- 3. Botón de Mantenimiento -->
        <section class="bg-gradient-to-r from-gray-900 to-gray-900/40 border border-gray-800 rounded-2xl p-4 text-center space-y-2">
            <p class="text-xs text-gray-400">¿Te gusta esta herramienta gratuita?</p>
            <!-- REEMPLAZA ESTE ENLACE POR TU LINKTREE, KO-FI O BINANCE -->
            <a href="https://app.binance.com/uni-qr/SK7mhcai" target="_blank" class="w-full bg-gray-800 hover:bg-gray-700 text-yellow-500 border border-gray-700 font-medium py-2.5 rounded-xl transition text-xs flex justify-center items-center gap-2">
                ⚡ Apoyar el proyecto (Binance)
            </a>
        </section>


    </main>

    <!-- Script de Conexión y Audio -->
    <script>
        const socket = io();
        let isConnected = false;

        // Efectos de sonido integrados mediante enlaces públicos rápidos
        const sounds = {
            follow: new Audio('https://www.myinstants.com/media/sounds/tada.mp3'),
            like: new Audio('https://www.myinstants.com/media/sounds/pop_1.mp3'),
            giftLow: new Audio('https://www.myinstants.com/media/sounds/coin.mp3'),
            giftEpic: new Audio('https://www.myinstants.com/media/sounds/air-horn-club-sample.mp3')
        };

        function toggleConnection() {
            const user = document.getElementById('tiktok-user').value.trim();
            const btn = document.getElementById('connect-btn');

            if (!user) {
                alert('Por favor, escribe tu nombre de usuario de TikTok.');
                return;
            }

            if (!isConnected) {
                socket.emit('start-live', user);
                btn.textContent = 'Conectando...';
            } else {
                socket.emit('stop-live');
            }
        }

        // Recibir estado de conexión del servidor
        socket.on('connection-status', (data) => {
            const btn = document.getElementById('connect-btn');
            const badge = document.getElementById('status-badge');

            if (data.status === 'connected') {
                isConnected = true;
                btn.textContent = 'Desconectar Transmisión';
                btn.className = "w-full bg-red-600 hover:bg-red-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-red-600/20 text-sm flex justify-center items-center gap-2";
                
                badge.className = "flex items-center gap-2 bg-green-950/50 border border-green-800/50 px-3 py-1 rounded-full text-xs text-green-400";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> ${data.message}`;
            } else {
                isConnected = false;
                btn.textContent = 'Conectar Transmisión';
                btn.className = "w-full bg-pink-600 hover:bg-pink-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-pink-600/20 text-sm flex justify-center items-center gap-2";
                
                badge.className = "flex items-center gap-2 bg-red-950/50 border border-red-800/50 px-3 py-1 rounded-full text-xs text-red-400";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Desconectado`;
            }
        });

        // Recibir alertas en tiempo real y reproducir sonidos
        socket.on('play-alert', (data) => {
            const logBox = document.getElementById('event-log');
            let message = '';
            let soundToPlay = null;

            if (data.type === 'follow') {
                message = `🎉 <span class="text-pink-400 font-bold">${data.name}</span> comenzó a seguirte.`;
                soundToPlay = sounds.follow;
            } else if (data.type === 'like') {
                message = `❤️ <span class="text-red-400 font-bold">${data.name}</span> dio Me Gusta.`;
                soundToPlay = sounds.like;
            } else if (data.type === 'gift') {
                message = `🎁 <span class="text-yellow-400 font-bold">${data.name}</span> envió <span class="text-white">${data.giftName}</span> (${data.diamonds} monedas).`;
                soundToPlay = (data.tier === 'epic') ? sounds.giftEpic : sounds.giftLow;
            }

            // Reproducir sonido si está disponible
            if (soundToPlay) {
                soundToPlay.currentTime = 0;
                soundToPlay.play().catch(e => console.log("Audio bloqueado por navegador, interactúa con la página"));
            }

            // Agregar al registro visual
            const p = document.createElement('p');
            p.innerHTML = message;
            logBox.prepend(p);
        });
    </script>
</body>
</html>
