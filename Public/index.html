<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAlerts LIVE</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #0f1115;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h1, h2, h3 {
            margin: 0 0 10px 0;
        }
        .header-title {
            color: #ff3b5c;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .card {
            background-color: #1a1c23;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2a2d37;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #12141a;
            border: 1px solid #2a2d37;
            border-radius: 4px;
            color: #fff;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #ff3b5c;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            opacity: 0.9;
        }
        .status {
            font-size: 0.85rem;
            color: #a0a0a5;
            margin-top: 5px;
        }
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-box {
            background-color: #1a1c23;
            border: 1px solid #2a2d37;
            border-radius: 8px;
            padding: 12px;
        }
        .stat-header {
            font-size: 0.8rem;
            color: #a0a0a5;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .stat-desc {
            font-size: 0.75rem;
            color: #707075;
            margin-top: 5px;
        }
        .label-group {
            margin-bottom: 10px;
        }
        .label-group label {
            font-size: 0.85rem;
            color: #b0b0b5;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header-title">StreamAlerts LIVE</div>

    <!-- Conectar Transmisión -->
    <div class="card">
        <div class="card-title">🔗 Conectar Transmisión</div>
        <input type="text" id="usernameInput" placeholder="Usuario de TikTok">
        <button id="connectBtn">Conectar</button>
        <div class="status" id="connectionStatus">Estado: Desconectado</div>
    </div>

    <!-- Repositorio de Sonidos -->
    <div class="card">
        <div class="card-title">⚙️ Repositorio de Sonidos</div>
        <div style="font-size: 0.8rem; color: #a0a0a5; margin-bottom: 10px;">Asigna un audio para cada interacción en TikTok</div>
        
        <div class="label-group">
            <label>Nuevos Seguidores</label>
            <select id="soundFollower">
                <option value="">Ninguno (Silencio)</option>
                <!-- Agrega aquí los nombres reales de tus archivos en la carpeta Sounds -->
                <option value="follower.mp3">Seguidor por defecto</option>
            </select>
        </div>

        <div class="label-group">
            <label>Alerta de Regalos</label>
            <select id="soundGift">
                <option value="">Ninguno (Silencio)</option>
                <option value="gift.mp3">Regalo por defecto</option>
            </select>
        </div>
    </div>

    <!-- Seguidores y Regalos -->
    <div class="stats-container">
        <div class="stat-box">
            <div class="stat-header">👥 SEGUIDORES</div>
            <div class="stat-value" id="followerCount">0</div>
            <div class="stat-desc" id="followerStatus">Esperando seguidores...</div>
        </div>
        <div class="stat-box">
            <div class="stat-header" style="color: #ff9800;">🎁 REGALOS</div>
            <div class="stat-value" id="giftCount">0</div>
            <div class="stat-desc" id="giftStatus">Esperando regalos...</div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectInterval = null;
        let isConnected = false;

        const connectBtn = document.getElementById('connectBtn');
        const usernameInput = document.getElementById('usernameInput');
        const connectionStatus = document.getElementById('connectionStatus');
        const followerCountEl = document.getElementById('followerCount');
        const giftCountEl = document.getElementById('giftCount');
        const followerStatusEl = document.getElementById('followerStatus');
        const giftStatusEl = document.getElementById('giftStatus');

        let followersCount = 0;
        let giftsCount = 0;

        // Reproductor de audio seguro (soluciona el bloqueo en móviles)
        function playSound(filename) {
            if (!filename) return;
            const audio = new Audio(`Sounds/${filename}`);
            audio.play().catch(error => {
                console.log("Audio bloqueado por políticas del navegador:", error);
            });
        }

        // Detecta dinámicamente el protocolo seguro wss:// o ws:// según Render
        function getWebSocketURL() {
            const loc = window.location;
            const protocol = loc.protocol === 'https:' ? 'wss://' : 'ws://';
            return `${protocol}${loc.host}`;
        }

        function connectWebSocket(username) {
            if (!username) {
                alert("Por favor ingresa un usuario de TikTok");
                return;
            }

            connectionStatus.textContent = "Estado: Conectando...";
            connectionStatus.style.color = "#ff9800";

            ws = new WebSocket(getWebSocketURL());

            ws.onopen = () => {
                isConnected = true;
                connectionStatus.textContent = "Estado: Conectado";
                connectionStatus.style.color = "#4caf50";
                connectBtn.textContent = "Desconectar";
                connectBtn.style.backgroundColor = "#d32f2f";

                // Enviar el usuario configurado al backend
                ws.send(JSON.stringify({ action: 'set_username', username: username }));

                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'follower') {
                        followersCount++;
                        followerCountEl.textContent = followersCount;
                        followerStatusEl.textContent = `Nuevo: ${data.user || 'Usuario'}`;
                        playSound(document.getElementById('soundFollower').value);
                    } else if (data.type === 'gift') {
                        giftsCount += (data.count || 1);
                        giftCountEl.textContent = giftsCount;
                        giftStatusEl.textContent = `${data.user || 'Usuario'} envió regalo`;
                        playSound(document.getElementById('soundGift').value);
                    }
                } catch (e) {
                    console.error("Error al procesar mensaje:", e);
                }
            };

            ws.onclose = () => {
                handleDisconnect();
            };

            ws.onerror = (error) => {
                console.error("Error en WebSocket:", error);
                handleDisconnect();
            };
        }

        function handleDisconnect() {
            isConnected = false;
            connectionStatus.textContent = "Estado: Desconectado (Reintentando...)";
            connectionStatus.style.color = "#f44336";
            connectBtn.textContent = "Conectar";
            connectBtn.style.backgroundColor = "#ff3b5c";

            // Intento automático de reconexión cada 5 segundos si el usuario no cerró manualmente
            if (!reconnectInterval && usernameInput.value.trim() !== "") {
                reconnectInterval = setInterval(() => {
                    connectWebSocket(usernameInput.value.trim());
                }, 5000);
            }
        }

        connectBtn.addEventListener('click', () => {
            // Desbloqueo forzado de audio por interacción táctil
            const dummyAudio = new Audio();
            dummyAudio.play().catch(() => {});

            if (isConnected) {
                if (ws) ws.close();
                if (reconnectInterval) clearInterval(reconnectInterval);
                handleDisconnect();
                connectionStatus.textContent = "Estado: Desconectado";
            } else {
                connectWebSocket(usernameInput.value.trim());
            }
        });

        // Registrar Service Worker de forma segura
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }
    </script>
</body>
</html>
